[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vflorence"
version = "0.1.0"
description = "Tiny CPU inference for BART and Florence-2: paged KV cache, continuous batching, beam search"
requires-python = ">=3.12"
dependencies = [
  "transformers",
  "Pillow",
  "torch==2.15.0",
  "torchvision",
  "tqdm",
  "vllm-cpu-attn",
  "xxhash",
]

[tool.uv]
no-build-isolation-package = ["vllm-cpu-attn"]

[tool.uv.sources]
vllm-cpu-attn = { git = "https://github.com/ducviet00/vllm-cpu-attention.git" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["vflorence*"]
